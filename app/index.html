<!-- 【交接29-5】/app/ 測試版已併回根目錄入口頁（../）。這頁只負責轉址：網址參數（?src=pwa、?wait=、?route=、?probe=）原樣帶過去，

     /app/sw.js 換成自我註銷版：舊測試版的 service worker 下次連線時自己拆掉，之後由根目錄的 service worker 接手。 -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#9e2a2b">
<meta http-equiv="refresh" content="0; url=../">
<script>location.replace(new URL('../', location.href).pathname + location.search + location.hash);</script>
<style>

  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#111827; --fg:#f3f4f6; } }
  body { margin:0; padding:40px 16px; background:var(--bg); color:var(--fg); text-align:center; font-family:-apple-system, "PingFang TC", "Noto Sans TC", sans-serif; }
  a { color:var(--red); }
</style>
